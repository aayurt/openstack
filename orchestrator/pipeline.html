<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Pipeline Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --surface3: #22222e;
  --border: #1e1e2e;
  --border2: #2a2a3e;
  --border3: #3a3a50;
  --text: #e0e0e8;
  --text2: #8888a0;
  --text3: #55556a;
  --accent: #5b7fff;
  --accent2: #3d5cd9;
  --accent-bg: rgba(91,127,255,0.1);
  --green: #4CAF50;
  --green-bg: rgba(76,175,80,0.15);
  --orange: #FF9800;
  --orange-bg: rgba(255,152,0,0.15);
  --blue: #2196F3;
  --blue-bg: rgba(33,150,243,0.15);
  --purple: #9C27B0;
  --cyan: #00BCD4;
  --red: #F44336;
  --red-bg: rgba(244,67,54,0.15);
  --gray: #607D8B;
  --pink: #E91E63;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --radius: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
}

html, body {
  width: 100%; height: 100%;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  display: grid;
  grid-template-rows: 44px 1fr 30px;
  grid-template-columns: 224px 1fr 300px;
  grid-template-areas:
    "topbar topbar topbar"
    "sidebar canvas config"
    "bottom bottom bottom";
  width: 100%; height: 100%;
}

/* ============================================================
   TOP BAR
   ============================================================ */
#topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  user-select: none;
}

.logo {
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
  margin-right: 6px;
  white-space: nowrap;
  letter-spacing: -0.3px;
}

.sep {
  width: 1px; height: 22px;
  background: var(--border2);
  margin: 0 4px;
  flex-shrink: 0;
}

#pipeline-name {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  width: 180px;
  transition: border-color 0.15s;
}
#pipeline-name:hover { border-color: var(--border2); }
#pipeline-name:focus { border-color: var(--accent); outline: none; }

#pipeline-version {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
  padding: 4px 6px;
  border-radius: 4px;
  width: 42px;
  text-align: center;
  font-family: var(--mono);
}
#pipeline-version:focus { border-color: var(--accent); outline: none; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border: 1px solid var(--border2);
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s;
  font-family: var(--font);
  line-height: 1;
}
.btn:hover { background: var(--border); border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red-bg); }
.btn.success { border-color: var(--green); color: var(--green); }
.btn.success:hover { background: var(--green-bg); }
.btn:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.btn.sm { padding: 3px 7px; font-size: 11px; }

.spacer { flex: 1; }

#zoom-display {
  font-size: 11px;
  color: var(--text2);
  min-width: 42px;
  text-align: center;
  font-family: var(--mono);
}

/* ============================================================
   SIDEBAR
   ============================================================ */
#sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px 0;
  z-index: 50;
  user-select: none;
}

#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: transparent; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.palette-category { padding: 0 6px; margin-bottom: 2px; }

.palette-category-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text2);
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.12s;
}
.palette-category-header:hover { background: var(--surface2); }
.palette-category-header::before {
  content: '▸';
  font-size: 8px;
  transition: transform 0.15s;
  display: inline-block;
}
.palette-category-header.open::before { transform: rotate(90deg); }

.palette-items { display: none; }
.palette-items.open { display: block; }

.palette-node {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px 5px 14px;
  margin: 1px 0;
  border-radius: 4px;
  cursor: grab;
  transition: background 0.1s;
}
.palette-node:hover { background: var(--surface2); }
.palette-node:active { cursor: grabbing; background: var(--surface3); }

.palette-node .color-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.palette-node-info { display: flex; flex-direction: column; gap: 1px; }
.palette-node .node-label { font-size: 12px; color: var(--text); }
.palette-node .node-type { font-size: 10px; color: var(--text3); font-family: var(--mono); }

/* ============================================================
   CANVAS
   ============================================================ */
#canvas-container {
  grid-area: canvas;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  cursor: default;
}

#canvas-grid {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

#canvas {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
}

#edges-svg {
  position: absolute;
  top: 0; left: 0;
  width: 10000px; height: 10000px;
  pointer-events: none;
  overflow: visible;
}

#edges-svg path.edge {
  pointer-events: stroke;
  cursor: pointer;
  transition: stroke-width 0.1s;
}

#edges-svg path.edge:hover {
  stroke-width: 4 !important;
  filter: brightness(1.3);
}

#edges-svg path.edge.selected {
  stroke-width: 4 !important;
  filter: drop-shadow(0 0 4px var(--accent));
}

#temp-edge {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-dasharray: 8 4;
  pointer-events: none;
  opacity: 0.8;
}

/* ============================================================
   NODE
   ============================================================ */
.node {
  position: absolute;
  width: 180px;
  min-height: 56px;
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 10px;
  cursor: move;
  user-select: none;
  transition: box-shadow 0.15s, border-color 0.15s;
  z-index: 10;
  overflow: visible;
}

.node:hover {
  border-color: var(--border3);
  box-shadow: var(--shadow);
}

.node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,127,255,0.25), var(--shadow-lg);
  z-index: 20;
}

.node.running {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-bg), var(--shadow);
}

.node.completed {
  border-color: var(--green);
}

.node.failed {
  border-color: var(--red);
}

.node-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 28px 7px 10px;
  border-radius: 8px 8px 0 0;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  min-height: 28px;
}

.node-header .icon { font-size: 13px; line-height: 1; }
.node-header .type-badge {
  font-size: 9px;
  opacity: 0.7;
  font-weight: 400;
  margin-left: auto;
}

.node-body {
  padding: 6px 10px 4px;
  font-size: 10px;
  color: var(--text2);
  line-height: 1.4;
}

.node-id {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  padding: 2px 10px 6px;
}

.node-status {
  position: absolute;
  top: 9px; right: 9px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
  transition: background 0.2s;
  z-index: 5;
}

.node-status.pending { background: #555; }
.node-status.queued { background: var(--orange); }
.node-status.running { background: var(--blue); animation: statusPulse 1.2s ease-in-out infinite; }
.node-status.completed { background: var(--green); }
.node-status.failed { background: var(--red); }
.node-status.retrying { background: var(--orange); animation: statusPulse 0.8s ease-in-out infinite; }
.node-status.blocked { background: var(--text3); }
.node-status.cancelled { background: var(--text3); }
.node-status.skipped { background: var(--text3); }

@keyframes statusPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50% { opacity: 0.6; box-shadow: 0 0 0 3px currentColor; }
}

.node-check {
  position: absolute;
  bottom: -4px; right: -4px;
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #fff;
  z-index: 5;
  display: none;
}

.node.completed .node-check { display: flex; background: var(--green); }
.node.failed .node-check { display: flex; background: var(--red); }

/* ============================================================
   PORTS
   ============================================================ */
.port {
  position: absolute;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--text3);
  cursor: crosshair;
  z-index: 30;
  transition: all 0.12s;
}

.port:hover {
  border-color: var(--accent);
  background: var(--accent);
  transform: scale(1.4);
  box-shadow: 0 0 8px rgba(91,127,255,0.5);
}

.port.input { left: -7px; }
.port.output { right: -7px; }

.port.compatible {
  border-color: var(--green);
  animation: portGlow 0.8s ease-in-out infinite;
}

.port.active {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(91,127,255,0.6);
}

@keyframes portGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
  50% { box-shadow: 0 0 0 5px rgba(76,175,80,0); }
}

.port-label {
  position: absolute;
  font-size: 9px;
  color: var(--text3);
  white-space: nowrap;
  pointer-events: none;
  font-family: var(--mono);
}

/* ============================================================
   CONFIG PANEL
   ============================================================ */
#config-panel {
  grid-area: config;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  z-index: 50;
}

#config-panel::-webkit-scrollbar { width: 4px; }
#config-panel::-webkit-scrollbar-track { background: transparent; }
#config-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

#config-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text3);
  font-size: 12px;
  text-align: center;
  padding: 24px;
  gap: 8px;
}

#config-empty .icon { font-size: 32px; opacity: 0.3; }

#config-content { display: none; }
#config-content.visible { display: block; }

.config-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 5;
}

.config-color-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.config-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.config-section-title {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text3);
  margin-bottom: 10px;
}

.config-field { margin-bottom: 10px; }
.config-field:last-child { margin-bottom: 0; }

.config-field label {
  display: block;
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 3px;
}

.config-field input,
.config-field select,
.config-field textarea {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--mono);
  transition: border-color 0.12s;
}

.config-field input:focus,
.config-field select:focus,
.config-field textarea:focus {
  border-color: var(--accent);
  outline: none;
}

.config-field textarea {
  min-height: 64px;
  resize: vertical;
}

.config-field .hint {
  font-size: 10px;
  color: var(--text3);
  margin-top: 2px;
}

.config-actions {
  padding: 12px 16px;
  display: flex;
  gap: 8px;
}

.config-ports-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.port-info {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 0;
  font-size: 11px;
}

.port-info .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text3);
}

.port-info .dot.in { background: var(--blue); }
.port-info .dot.out { background: var(--green); }
.port-info .name { font-family: var(--mono); color: var(--text2); }

/* ============================================================
   BOTTOM BAR
   ============================================================ */
#bottombar {
  grid-area: bottom;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text2);
  z-index: 100;
  user-select: none;
}

#connection-status {
  display: flex;
  align-items: center;
  gap: 5px;
}

#connection-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  transition: background 0.3s;
}

#connection-dot.disconnected { background: var(--red); }

#exec-status {
  color: var(--text);
  font-weight: 500;
}

#exec-node {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 11px;
}

#dirty-indicator {
  color: var(--orange);
  display: none;
  font-size: 11px;
  animation: dirtyBlink 2s ease-in-out infinite;
}

#dirty-indicator.visible { display: inline; }

@keyframes dirtyBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============================================================
   EXECUTION PANEL
   ============================================================ */
#exec-panel {
  position: fixed;
  bottom: 30px;
  left: 224px;
  right: 300px;
  max-height: 240px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
  display: none;
  z-index: 90;
  overflow-y: auto;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
}

#exec-panel.visible { display: block; }

#exec-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 12px;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

#exec-panel-body { padding: 8px 14px; font-size: 12px; }

.exec-result {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.exec-result:last-child { border-bottom: none; }

.exec-result .node-name {
  font-weight: 600;
  min-width: 100px;
  font-family: var(--mono);
  font-size: 11px;
}

.exec-result .status-badge {
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
}

.exec-result .status-completed { background: var(--green-bg); color: var(--green); }
.exec-result .status-failed { background: var(--red-bg); color: var(--red); }
.exec-result .status-running { background: var(--blue-bg); color: var(--blue); }
.exec-result .status-pending { background: var(--surface3); color: var(--text3); }
.exec-result .status-queued { background: var(--orange-bg); color: var(--orange); }
.exec-result .output-text {
  flex: 1;
  color: var(--text2);
  font-family: var(--mono);
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.12s;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  min-width: 380px;
  max-width: 520px;
  max-height: 80vh;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: modalSlide 0.15s;
}

@keyframes modalSlide {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 14px 18px;
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}

.modal-body {
  padding: 16px 18px;
  overflow-y: auto;
  max-height: 60vh;
}

.modal-footer {
  padding: 12px 18px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border);
}

.modal-list {
  list-style: none;
}

.modal-list li {
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  transition: background 0.1s;
}

.modal-list li:hover { background: var(--surface2); }

.modal-list li .name { font-weight: 500; }
.modal-list li .meta { color: var(--text3); font-size: 11px; font-family: var(--mono); }

.modal-input {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 4px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--mono);
}

.modal-input:focus { border-color: var(--accent); outline: none; }

.modal-label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 6px;
}

.modal-field { margin-bottom: 12px; }

/* ============================================================
   TOAST NOTIFICATIONS
   ============================================================ */
#toast-container {
  position: fixed;
  top: 54px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.2s;
  max-width: 320px;
}

.toast.success { background: #1a3a1a; border: 1px solid var(--green); color: var(--green); }
.toast.error { background: #3a1a1a; border: 1px solid var(--red); color: var(--red); }
.toast.info { background: #1a1a3a; border: 1px solid var(--accent); color: var(--accent); }

@keyframes toastIn {
  from { transform: translateX(20px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ============================================================
   CONTEXT MENU
   ============================================================ */
#context-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 4px 0;
  min-width: 160px;
  z-index: 3000;
  box-shadow: var(--shadow-lg);
  display: none;
}

#context-menu.visible { display: block; }

.ctx-item {
  padding: 6px 14px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.08s;
}

.ctx-item:hover { background: var(--surface2); }
.ctx-item.danger { color: var(--red); }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }
.ctx-item .shortcut { margin-left: auto; color: var(--text3); font-size: 10px; font-family: var(--mono); }
</style>
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <span class="logo">⬡ Pipeline</span>

<script>
// =========================================================================
// STATE
// =========================================================================
const state = {
  nodes: [],
  edges: [],
  selectedNodeId: null,
  selectedEdgeIdx: null,
  zoom: 1,
  panX: 0,
  panY: 0,
  dirty: false,
  categories: {},
  portMap: {},
  nodeTypeColors: {},
  nodeTypeLabels: {},
  executionId: null,
  executionStatus: 'idle',
  undoStack: [],
  redoStack: [],
  clipboard: null,
  lastNodeId: 0,
};

const MAX_UNDO = 60;

// =========================================================================
// NODE TYPE METADATA
// =========================================================================
const NODE_ICONS = {
  'task.input': '📥',
  'laya.classify': '🏷️',
  'laya.triage': '🔀',
  'task.readiness': '✅',
  'worker.router': '🔀',
  'opencode.worker': '⚙️',
  'test': '🧪',
  'control.retry': '🔄',
  'control.condition': '❓',
  'control.join': '🔗',
  'hermes.replan': '🧠',
  'sink.done': '🏁',
};

const NODE_CONFIG_FIELDS = {
  'task.input': [
    { key: 'task_id', label: 'Task ID', type: 'text', hint: 'Unique task identifier' },
    { key: 'project', label: 'Project', type: 'text', hint: 'Project name' },
    { key: 'objective', label: 'Objective', type: 'textarea', hint: 'What needs to be done' },
    { key: 'acceptance', label: 'Acceptance Criteria', type: 'textarea', hint: 'How to verify completion' },
    { key: 'priority', label: 'Priority', type: 'select', options: ['low','medium','high','critical'] },
  ],
  'laya.classify': [],
  'laya.triage': [],
  'task.readiness': [],
  'worker.router': [
    { key: 'preferred_slot', label: 'Preferred Slot', type: 'text', hint: 'Preferred executor slot' },
  ],
  'opencode.worker': [
    { key: 'model', label: 'Model', type: 'text', hint: 'LLM model identifier' },
    { key: 'timeout', label: 'Timeout (s)', type: 'number', hint: 'Execution timeout in seconds' },
    { key: 'command', label: 'Command', type: 'text', hint: 'Override command to run' },
  ],
  'test': [
    { key: 'verify_command', label: 'Verify Command', type: 'text', hint: 'Shell command for verification' },
  ],
  'control.retry': [
    { key: 'max_retries', label: 'Max Retries', type: 'number', hint: 'Maximum retry attempts' },
    { key: 'strategy', label: 'Strategy', type: 'select', options: ['exponential','fixed','linear'] },
  ],
  'control.condition': [
    { key: 'expression', label: 'Expression', type: 'text', hint: 'Boolean expression to evaluate' },
  ],
  'control.join': [],
  'hermes.replan': [],
  'sink.done': [],
};

const NODE_PORT_DEFS = {
  'task.input': { inputs: [], outputs: ['output'] },
  'laya.classify': { inputs: ['input'], outputs: ['output'] },
  'laya.triage': { inputs: ['input'], outputs: ['pass','retry','escalate'] },
  'task.readiness': { inputs: ['input'], outputs: ['ready','blocked'] },
  'worker.router': { inputs: ['input'], outputs: ['output'] },
  'opencode.worker': { inputs: ['input'], outputs: ['output'] },
  'test': { inputs: ['input'], outputs: ['pass','fail'] },
  'control.retry': { inputs: ['input'], outputs: ['output'] },
  'control.condition': { inputs: ['input'], outputs: ['true','false'] },
  'control.join': { inputs: ['input_a','input_b'], outputs: ['output'] },
  'hermes.replan': { inputs: ['input'], outputs: ['output'] },
  'sink.done': { inputs: ['input'], outputs: [] },
};

const DEFAULT_COLORS = {
  'task.input': '#4CAF50',
  'laya.classify': '#FF9800',
  'laya.triage': '#FF9800',
  'task.readiness': '#2196F3',
  'worker.router': '#2196F3',
  'opencode.worker': '#9C27B0',
  'test': '#00BCD4',
  'control.retry': '#F44336',
  'control.condition': '#607D8B',
  'control.join': '#607D8B',
  'hermes.replan': '#E91E63',
  'sink.done': '#4CAF50',
};

function getColor(type) {
  return state.nodeTypeColors[type] || DEFAULT_COLORS[type] || '#666';
}

function getLabel(type) {
  return state.nodeTypeLabels[type] || type;
}

function getPorts(type) {
  return state.portMap[type] || NODE_PORT_DEFS[type] || { inputs: [], outputs: [] };
}

function getNodeById(id) {
  return state.nodes.find(n => n.id === id);
}

function generateNodeId(type) {
  state.lastNodeId++;
  const base = type.replace(/\./g, '_');
  return base + '_' + state.lastNodeId;
}

// =========================================================================
// DOM REFS
// =========================================================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const $canvas = $('#canvas');
const $container = $('#canvas-container');
const $edgesSvg = $('#edges-svg');
const $tempEdge = $('#temp-edge');
const $sidebar = $('#sidebar');
const $configEmpty = $('#config-empty');
const $configContent = $('#config-content');
const $nodeCount = $('#node-count');
const $edgeCount = $('#edge-count');
const $dirtyInd = $('#dirty-indicator');
const $execStatus = $('#exec-status');
const $execNode = $('#exec-node');
const $connDot = $('#connection-dot');
const $connText = $('#connection-text');
const $zoomDisp = $('#zoom-display');
const $cfgTypeFields = $('#cfg-type-fields');
const $cfgPorts = $('#cfg-ports');
const $contextMenu = $('#context-menu');
const $toastContainer = $('#toast-container');

// =========================================================================
// TOAST
// =========================================================================
function toast(msg, type = 'info', duration = 3000) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $toastContainer.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    el.style.transition = 'all 0.2s';
    setTimeout(() => el.remove(), 200);
  }, duration);
}

// =========================================================================
// INIT
// =========================================================================
async function init() {
  buildSidebar();
  await fetchCategories();
  await loadDefault();
  bindEvents();
  updateCounts();
}

async function fetchCategories() {
  try {
    const res = await fetch('/api/pipeline/categories');
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    state.categories = data.categories || {};
    state.portMap = data.ports || {};
    for (const nodes of Object.values(state.categories)) {
      for (const n of nodes) {
        state.nodeTypeColors[n.type] = n.color;
        state.nodeTypeLabels[n.type] = n.label;
      }
    }
    buildSidebar();
  } catch (e) {
    console.warn('Using default categories:', e.message);
  }
}

// =========================================================================
// SIDEBAR
// =========================================================================
function buildSidebar() {
  const cats = Object.keys(state.categories).length > 0 ? state.categories : {
    'Input': [{type:'task.input',label:'Task Input',color:'#4CAF50'}],
    'Laya': [{type:'laya.classify',label:'Laya Classify',color:'#FF9800'},{type:'laya.triage',label:'Laya Triage',color:'#FF9800'}],
    'Execution': [{type:'task.readiness',label:'Readiness Check',color:'#2196F3'},{type:'worker.router',label:'Worker Router',color:'#2196F3'},{type:'opencode.worker',label:'OpenCode Worker',color:'#9C27B0'}],
    'Validation': [{type:'test',label:'Tests',color:'#00BCD4'}],
    'Control': [{type:'control.retry',label:'Retry',color:'#F44336'},{type:'control.condition',label:'Condition',color:'#607D8B'},{type:'control.join',label:'Join',color:'#607D8B'}],
    'Hermes': [{type:'hermes.replan',label:'Hermes Re-plan',color:'#E91E63'}],
    'Output': [{type:'sink.done',label:'Done',color:'#4CAF50'}],
  };

  let html = '';
  for (const [cat, nodes] of Object.entries(cats)) {
    html += `<div class="palette-category">
      <div class="palette-category-header open" data-cat="${cat}">${cat}</div>
      <div class="palette-items open" data-cat-items="${cat}">`;
    for (const n of nodes) {
      html += `<div class="palette-node" draggable="true" data-type="${n.type}">
        <div class="color-dot" style="background:${n.color}"></div>
        <div class="palette-node-info">
          <div class="node-label">${n.label}</div>
          <div class="node-type">${n.type}</div>
        </div>
      </div>`;
    }
    html += '</div></div>';
  }
  $sidebar.innerHTML = html;

  // Category toggle
  $sidebar.querySelectorAll('.palette-category-header').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('open');
      const items = el.nextElementSibling;
      items.classList.toggle('open');
    });
  });

  // Drag from palette
  $sidebar.querySelectorAll('.palette-node').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('application/pipeline-node', el.dataset.type);
      e.dataTransfer.effectAllowed = 'copy';
      el.style.opacity = '0.5';
    });
    el.addEventListener('dragend', () => {
      el.style.opacity = '';
    });
  });
}

// =========================================================================
// CANVAS COORDINATE HELPERS
// =========================================================================
function screenToCanvas(sx, sy) {
  const rect = $container.getBoundingClientRect();
  return {
    x: (sx - rect.left - state.panX) / state.zoom,
    y: (sy - rect.top - state.panY) / state.zoom,
  };
}

function canvasToScreen(cx, cy) {
  const rect = $container.getBoundingClientRect();
  return {
    x: cx * state.zoom + state.panX + rect.left,
    y: cy * state.zoom + state.panY + rect.top,
  };
}

function updateTransform() {
  $canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
  $zoomDisp.textContent = Math.round(state.zoom * 100) + '%';
}

// =========================================================================
// NODE RENDERING
// =========================================================================
function renderNode(node) {
  const existing = document.getElementById('node-' + node.id);
  if (existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'node' + (state.selectedNodeId === node.id ? ' selected' : '');
  el.id = 'node-' + node.id;
  el.dataset.nodeId = node.id;
  el.style.left = node.position.x + 'px';
  el.style.top = node.position.y + 'px';

  const color = getColor(node.type);
  const label = node.label || getLabel(node.type);
  const icon = NODE_ICONS[node.type] || '●';
  const ports = getPorts(node.type);

  // Header
  const header = document.createElement('div');
  header.className = 'node-header';
  header.style.background = color;
  header.innerHTML = `<span class="icon">${icon}</span><span>${escHtml(label)}</span>`;
  el.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'node-body';
  body.textContent = node.type;
  el.appendChild(body);

  // ID
  const idEl = document.createElement('div');
  idEl.className = 'node-id';
  idEl.textContent = '#' + node.id;
  el.appendChild(idEl);

  // Status dot
  const status = document.createElement('div');
  status.className = 'node-status pending';
  status.id = 'status-' + node.id;
  el.appendChild(status);

  // Completion checkmark
  const check = document.createElement('div');
  check.className = 'node-check';
  check.textContent = '✓';
  el.appendChild(check);

  // Compute node height for port placement
  const nodeMinH = 56;

  // Input ports
  const inCount = ports.inputs.length;
  const inSpacing = inCount > 0 ? nodeMinH / (inCount + 1) : 0;
  ports.inputs.forEach((pName, i) => {
    const yPos = inCount > 0 ? inSpacing * (i + 1) : nodeMinH / 2;
    const port = document.createElement('div');
    port.className = 'port input';
    port.dataset.nodeId = node.id;
    port.dataset.portName = pName;
    port.dataset.portDir = 'input';
    port.style.top = (yPos - 6) + 'px';
    port.title = pName + ' (input)';
    el.appendChild(port);

    if (inCount > 1) {
      const lbl = document.createElement('div');
      lbl.className = 'port-label';
      lbl.style.top = (yPos - 5) + 'px';
      lbl.style.left = '14px';
      lbl.textContent = pName;
      el.appendChild(lbl);
    }
  });

  // Output ports
  const outCount = ports.outputs.length;
  const outSpacing = outCount > 0 ? nodeMinH / (outCount + 1) : 0;
  ports.outputs.forEach((pName, i) => {
    const yPos = outCount > 0 ? outSpacing * (i + 1) : nodeMinH / 2;
    const port = document.createElement('div');
    port.className = 'port output';
    port.dataset.nodeId = node.id;
    port.dataset.portName = pName;
    port.dataset.portDir = 'output';
    port.style.top = (yPos - 6) + 'px';
    port.title = pName + ' (output)';
    el.appendChild(port);

    if (outCount > 1) {
      const lbl = document.createElement('div');
      lbl.className = 'port-label';
      lbl.style.top = (yPos - 5) + 'px';
      lbl.style.right = '14px';
      lbl.textContent = pName;
      el.appendChild(lbl);
    }
  });

  $canvas.appendChild(el);
  bindNodeDrag(el, node);
}

function renderAllNodes() {
  $canvas.querySelectorAll('.node').forEach(el => el.remove());
  state.nodes.forEach(n => renderNode(n));
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// =========================================================================
// EDGE RENDERING
// =========================================================================
function renderEdges() {
  $edgesSvg.querySelectorAll('path.edge').forEach(p => p.remove());

  state.edges.forEach((edge, idx) => {
    const src = getNodeById(edge.source);
    const tgt = getNodeById(edge.target);
    if (!src || !tgt) return;

    const srcPos = getPortPosition(src, edge.source_port, 'output');
    const tgtPos = getPortPosition(tgt, edge.target_port, 'input');

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', bezierPath(srcPos.x, srcPos.y, tgtPos.x, tgtPos.y));
    path.classList.add('edge');
    if (idx === state.selectedEdgeIdx) path.classList.add('selected');

    const srcColor = getColor(src.type);
    path.setAttribute('stroke', srcColor);
    path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('marker-end', 'url(#arrowhead)');

    if (edge.condition) {
      path.setAttribute('stroke-dasharray', '8 4');
    }

    path.dataset.edgeIdx = idx;

    path.addEventListener('click', (e) => {
      e.stopPropagation();
      selectEdge(idx);
    });

    $edgesSvg.appendChild(path);
  });
}

function getPortPosition(node, portName, direction) {
  const ports = getPorts(node.type);
  const list = direction === 'output' ? ports.outputs : ports.inputs;
  const idx = list.indexOf(portName);
  const count = list.length;

  const nodeH = 56;
  const spacing = count > 1 ? nodeH / (count + 1) : nodeH / 2;
  const y = node.position.y + spacing * (idx + 1);

  if (direction === 'output') {
    return { x: node.position.x + 180, y };
  } else {
    return { x: node.position.x, y };
  }
}

function bezierPath(x1, y1, x2, y2) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);
  const cp = Math.max(dx * 0.4, 40);
  return `M ${x1} ${y1} C ${x1 + cp} ${y1}, ${x2 - cp} ${y2}, ${x2} ${y2}`;
}

// =========================================================================
// FULL RENDER
// =========================================================================
function render() {
  renderAllNodes();
  renderEdges();
  updateCounts();
}

function updateCounts() {
  $nodeCount.textContent = state.nodes.length;
  $edgeCount.textContent = state.edges.length;
}

function markDirty() {
  state.dirty = true;
  $dirtyInd.classList.add('visible');
}

function markClean() {
  state.dirty = false;
  $dirtyInd.classList.remove('visible');
}

// =========================================================================
// NODE DRAG ON CANVAS
// =========================================================================
function bindNodeDrag(el, node) {
  let dragging = false;
  let startX, startY, origX, origY;
  let moved = false;

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('port')) return;
    if (e.button !== 0) return;
    if (e.target.closest('#context-menu')) return;

    e.stopPropagation();
    selectNode(node.id);

    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    origX = node.position.x;
    origY = node.position.y;

    el.style.zIndex = '25';

    const onMove = (ev) => {
      if (!dragging) return;
      const dx = (ev.clientX - startX) / state.zoom;
      const dy = (ev.clientY - startY) / state.zoom;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
      node.position.x = Math.round(origX + dx);
      node.position.y = Math.round(origY + dy);
      el.style.left = node.position.x + 'px';
      el.style.top = node.position.y + 'px';
      renderEdges();
      updateConfigPosition();
    };

    const onUp = () => {
      dragging = false;
      el.style.zIndex = '';
      if (moved) {
        markDirty();
        pushUndo();
      }
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Context menu
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    selectNode(node.id);
    showContextMenu(e.clientX, e.clientY);
  });
}

// =========================================================================
// PORT / EDGE DRAWING
// =========================================================================
let drawingEdge = null;

$canvas.addEventListener('mousedown', (e) => {
  const port = e.target.closest('.port');
  if (!port) return;
  e.stopPropagation();
  e.preventDefault();

  const nodeId = port.dataset.nodeId;
  const portName = port.dataset.portName;
  const dir = port.dataset.portDir;
  const node = getNodeById(nodeId);
  if (!node) return;

  const pos = getPortPosition(node, portName, dir);

  drawingEdge = {
    startX: pos.x,
    startY: pos.y,
    dir: dir === 'output' ? 'source' : 'target',
    sourceNodeId: dir === 'output' ? nodeId : null,
    targetNodeId: dir === 'input' ? nodeId : null,
    sourcePort: dir === 'output' ? portName : null,
    targetPort: dir === 'input' ? portName : null,
  };

  // Highlight compatible ports
  $canvas.querySelectorAll('.port').forEach(p => {
    if (p.dataset.nodeId === nodeId) return;
    const pDir = p.dataset.portDir;
    const compatible = (dir === 'output' && pDir === 'input') || (dir === 'input' && pDir === 'output');
    if (compatible) p.classList.add('compatible');
  });

  port.classList.add('active');

  const onMove = (ev) => {
    const cp = screenToCanvas(ev.clientX, ev.clientY);
    if (drawingEdge.dir === 'source') {
      $tempEdge.setAttribute('d', bezierPath(drawingEdge.startX, drawingEdge.startY, cp.x, cp.y));
    } else {
      $tempEdge.setAttribute('d', bezierPath(cp.x, cp.y, drawingEdge.startX, drawingEdge.startY));
    }
  };

  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    $tempEdge.setAttribute('d', '');
    port.classList.remove('active');
    $canvas.querySelectorAll('.port.compatible').forEach(p => p.classList.remove('compatible'));

    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    if (target && target.classList.contains('port')) {
      const tNodeId = target.dataset.nodeId;
      const tPortName = target.dataset.portName;
      const tDir = target.dataset.portDir;

      if (drawingEdge.dir === 'source' && tDir === 'input') {
        addEdge(drawingEdge.sourceNodeId, tNodeId, drawingEdge.sourcePort, tPortName);
      } else if (drawingEdge.dir === 'target' && tDir === 'output') {
        addEdge(tNodeId, drawingEdge.sourceNodeId, tPortName, drawingEdge.targetPort);
      }
    }
    drawingEdge = null;
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

function addEdge(sourceId, targetId, sourcePort, targetPort) {
  if (sourceId === targetId) {
    toast('Cannot connect node to itself', 'error');
    return;
  }

  // Check if ports are compatible (output -> input)
  const srcNode = getNodeById(sourceId);
  const tgtNode = getNodeById(targetId);
  if (!srcNode || !tgtNode) return;

  const srcPorts = getPorts(srcNode.type);
  const tgtPorts = getPorts(tgtNode.type);

  if (!srcPorts.outputs.includes(sourcePort)) {
    toast(`Node ${sourceId} has no output port "${sourcePort}"`, 'error');
    return;
  }
  if (!tgtPorts.inputs.includes(targetPort)) {
    toast(`Node ${targetId} has no input port "${targetPort}"`, 'error');
    return;
  }

  // Only one edge per input port — remove existing
  const existingIdx = state.edges.findIndex(e => e.target === targetId && e.target_port === targetPort);
  if (existingIdx >= 0) {
    state.edges.splice(existingIdx, 1);
  }

  // Check for duplicate
  const dup = state.edges.find(e => e.source === sourceId && e.target === targetId && e.source_port === sourcePort && e.target_port === targetPort);
  if (dup) {
    toast('Edge already exists', 'info');
    return;
  }

  state.edges.push({
    source: sourceId,
    target: targetId,
    source_port: sourcePort,
    target_port: targetPort,
  });

  markDirty();
  pushUndo();
  renderEdges();
  updateCounts();
}

// =========================================================================
// SELECTION
// =========================================================================
function selectNode(nodeId) {
  state.selectedNodeId = nodeId;
  state.selectedEdgeIdx = null;

  $canvas.querySelectorAll('.node.selected').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('node-' + nodeId);
  if (el) el.classList.add('selected');

  $edgesSvg.querySelectorAll('path.edge').forEach(p => {
    p.classList.remove('selected');
    p.setAttribute('stroke-width', '2.5');
  });

  showConfig(nodeId);
}

function selectEdge(idx) {
  state.selectedEdgeIdx = idx;
  state.selectedNodeId = null;

  $canvas.querySelectorAll('.node.selected').forEach(el => el.classList.remove('selected'));
  hideConfig();

  $edgesSvg.querySelectorAll('path.edge').forEach(p => {
    p.classList.remove('selected');
    p.setAttribute('stroke-width', '2.5');
  });
  const path = $edgesSvg.querySelector(`path[data-edge-idx="${idx}"]`);
  if (path) {
    path.classList.add('selected');
    path.setAttribute('stroke-width', '4');
  }
}

function deselectAll() {
  state.selectedNodeId = null;
  state.selectedEdgeIdx = null;
  $canvas.querySelectorAll('.node.selected').forEach(el => el.classList.remove('selected'));
  $edgesSvg.querySelectorAll('path.edge').forEach(p => {
    p.classList.remove('selected');
    p.setAttribute('stroke-width', '2.5');
  });
  hideConfig();
}

// =========================================================================
// CONFIG PANEL
// =========================================================================
function showConfig(nodeId) {
  const node = getNodeById(nodeId);
  if (!node) return;

  $configEmpty.style.display = 'none';
  $configContent.classList.add('visible');

  const color = getColor(node.type);
  $('#cfg-color-dot').style.background = color;
  $('#cfg-type-name').textContent = getLabel(node.type) + ' (' + node.type + ')';
  $('#cfg-id').value = node.id;
  $('#cfg-label').value = node.label || '';
  $('#cfg-x').value = node.position.x;
  $('#cfg-y').value = node.position.y;

  // Ports info
  const ports = getPorts(node.type);
  let portsHtml = '<div class="config-section-title">Ports</div>';
  if (ports.inputs.length > 0) {
    for (const p of ports.inputs) {
      portsHtml += `<div class="port-info"><div class="dot in"></div><span class="name">${p}</span><span style="color:var(--text3);font-size:10px">input</span></div>`;
    }
  }
  if (ports.outputs.length > 0) {
    for (const p of ports.outputs) {
      portsHtml += `<div class="port-info"><div class="dot out"></div><span class="name">${p}</span><span style="color:var(--text3);font-size:10px">output</span></div>`;
    }
  }
  if (ports.inputs.length === 0 && ports.outputs.length === 0) {
    portsHtml += '<div style="color:var(--text3);font-size:11px">No ports</div>';
  }
  $cfgPorts.innerHTML = portsHtml;

  // Type-specific fields
  const fields = NODE_CONFIG_FIELDS[node.type] || [];
  let html = '<div class="config-section"><div class="config-section-title">Configuration</div>';

  if (fields.length === 0) {
    html += '<div style="color:var(--text3);font-size:11px;padding:4px 0">No configuration fields for this node type</div>';
  }

  for (const f of fields) {
    const val = node.config[f.key] != null ? node.config[f.key] : '';
    html += `<div class="config-field"><label>${f.label}</label>`;

    if (f.type === 'textarea') {
      html += `<textarea data-key="${f.key}">${escHtml(String(val))}</textarea>`;
    } else if (f.type === 'select') {
      html += `<select data-key="${f.key}">`;
      html += `<option value="">— select —</option>`;
      for (const opt of f.options) {
        html += `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`;
      }
      html += '</select>';
    } else if (f.type === 'number') {
      html += `<input type="number" data-key="${f.key}" value="${val}" step="1" />`;
    } else {
      html += `<input type="text" data-key="${f.key}" value="${escHtml(String(val))}" />`;
    }

    if (f.hint) {
      html += `<div class="hint">${f.hint}</div>`;
    }
    html += '</div>';
  }
  html += '</div>';
  $cfgTypeFields.innerHTML = html;

  // Bind config field events
  $cfgTypeFields.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.dataset.key;
      let val = el.value;
      if (el.type === 'number') val = val === '' ? null : Number(val);
      node.config[key] = val;
      markDirty();
    });
  });
}

function hideConfig() {
  $configEmpty.style.display = '';
  $configContent.classList.remove('visible');
}

function updateConfigPosition() {
  if (!state.selectedNodeId) return;
  const node = getNodeById(state.selectedNodeId);
  if (!node) return;
  $('#cfg-x').value = node.position.x;
  $('#cfg-y').value = node.position.y;
}

// Config field listeners for general fields
$('#cfg-id').addEventListener('change', function () {
  const node = getNodeById(state.selectedNodeId);
  if (!node) return;
  const oldId = node.id;
  const newId = this.value.trim().replace(/[^a-zA-Z0-9_\-\.]/g, '_');
  if (!newId || newId === oldId) { this.value = oldId; return; }

  if (state.nodes.some(n => n.id === newId && n !== node)) {
    toast('Node ID already exists', 'error');
    this.value = oldId;
    return;
  }

  node.id = newId;
  state.edges.forEach(e => {
    if (e.source === oldId) e.source = newId;
    if (e.target === oldId) e.target = newId;
  });

  markDirty();
  pushUndo();
  render();
  selectNode(newId);
  toast('Node renamed to ' + newId, 'success');
});

$('#cfg-label').addEventListener('change', function () {
  const node = getNodeById(state.selectedNodeId);
  if (!node) return;
  node.label = this.value;
  markDirty();
  pushUndo();
  renderNode(node);
  renderEdges();
  selectNode(node.id);
});

$('#cfg-x').addEventListener('change', function () {
  const node = getNodeById(state.selectedNodeId);
  if (!node) return;
  node.position.x = Number(this.value) || 0;
  markDirty();
  pushUndo();
  render();
  selectNode(node.id);
});

$('#cfg-y').addEventListener('change', function () {
  const node = getNodeById(state.selectedNodeId);
  if (!node) return;
  node.position.y = Number(this.value) || 0;
  markDirty();
  pushUndo();
  render();
  selectNode(node.id);
});

// =========================================================================
// DUPLICATE NODE
// =========================================================================
function duplicateNode() {
  if (!state.selectedNodeId) return;
  const src = getNodeById(state.selectedNodeId);
  if (!src) return;

  const newId = generateNodeId(src.type);
  const newNode = {
    id: newId,
    type: src.type,
    config: JSON.parse(JSON.stringify(src.config)),
    position: { x: src.position.x + 40, y: src.position.y + 40 },
    label: src.label ? src.label + ' (copy)' : '',
  };

  state.nodes.push(newNode);
  markDirty();
  pushUndo();
  renderNode(newNode);
  renderEdges();
  updateCounts();
  selectNode(newId);
  toast('Node duplicated', 'info');
  hideContextMenu();
}

// =========================================================================
// ZOOM / PAN
// =========================================================================
function zoomBy(delta) {
  const oldZoom = state.zoom;
  state.zoom = Math.max(0.15, Math.min(4, state.zoom + delta));

  // Zoom toward center of canvas
  const rect = $container.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  state.panX = cx - (cx - state.panX) * (state.zoom / oldZoom);
  state.panY = cy - (cy - state.panY) * (state.zoom / oldZoom);

  updateTransform();
}

function zoomReset() {
  state.zoom = 1;
  state.panX = 0;
  state.panY = 0;
  updateTransform();
}

function zoomFit() {
  if (state.nodes.length === 0) { zoomReset(); return; }

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of state.nodes) {
    minX = Math.min(minX, n.position.x);
    minY = Math.min(minY, n.position.y);
    maxX = Math.max(maxX, n.position.x + 180);
    maxY = Math.max(maxY, n.position.y + 60);
  }

  const rect = $container.getBoundingClientRect();
  const padding = 60;
  const contentW = maxX - minX + padding * 2;
  const contentH = maxY - minY + padding * 2;

  state.zoom = Math.min(rect.width / contentW, rect.height / contentH, 2);
  state.panX = (rect.width - contentW * state.zoom) / 2 - minX * state.zoom + padding * state.zoom;
  state.panY = (rect.height - contentH * state.zoom) / 2 - minY * state.zoom + padding * state.zoom;

  updateTransform();
}

$container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.07 : 0.07;
  const oldZoom = state.zoom;
  state.zoom = Math.max(0.15, Math.min(4, state.zoom + delta));

  const rect = $container.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  state.panX = mx - (mx - state.panX) * (state.zoom / oldZoom);
  state.panY = my - (my - state.panY) * (state.zoom / oldZoom);

  updateTransform();
}, { passive: false });

// Pan
let panning = false;
let panStartX, panStartY, panOrigX, panOrigY;

$container.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node') || e.target.closest('.port')) return;
  if (e.target.closest('#context-menu')) return;

  if (e.button === 1 || (e.button === 0 && (e.ctrlKey || e.metaKey))) {
    e.preventDefault();
    panning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panOrigX = state.panX;
    panOrigY = state.panY;
    $container.style.cursor = 'grabbing';
  } else if (e.button === 0 && !e.target.closest('.port')) {
    deselectAll();
  }
});

document.addEventListener('mousemove', (e) => {
  if (!panning) return;
  state.panX = panOrigX + (e.clientX - panStartX);
  state.panY = panOrigY + (e.clientY - panStartY);
  updateTransform();
});

document.addEventListener('mouseup', () => {
  if (panning) {
    panning = false;
    $container.style.cursor = '';
  }
});

// =========================================================================
// DRAG DROP FROM SIDEBAR
// =========================================================================
$container.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});

$container.addEventListener('drop', (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData('application/pipeline-node');
  if (!type) return;

  const pos = screenToCanvas(e.clientX, e.clientY);
  const id = generateNodeId(type);

  const node = {
    id,
    type,
    config: {},
    position: { x: Math.round(pos.x - 90), y: Math.round(pos.y - 30) },
    label: getLabel(type),
  };

  state.nodes.push(node);
  markDirty();
  pushUndo();
  renderNode(node);
  renderEdges();
  updateCounts();
  selectNode(id);
});

// =========================================================================
// DELETE
// =========================================================================
function deleteSelected() {
  hideContextMenu();
  if (state.selectedNodeId) {
    const id = state.selectedNodeId;
    const node = getNodeById(id);
    state.nodes = state.nodes.filter(n => n.id !== id);
    state.edges = state.edges.filter(e => e.source !== id && e.target !== id);
    state.selectedNodeId = null;
    hideConfig();
    markDirty();
    pushUndo();
    render();
    toast('Deleted node ' + (node?.label || id), 'info');
  } else if (state.selectedEdgeIdx !== null) {
    const edge = state.edges[state.selectedEdgeIdx];
    state.edges.splice(state.selectedEdgeIdx, 1);
    state.selectedEdgeIdx = null;
    markDirty();
    pushUndo();
    renderEdges();
    updateCounts();
    toast('Deleted edge', 'info');
  }
}

// =========================================================================
// UNDO / REDO
// =========================================================================
function pushUndo() {
  state.undoStack.push({
    nodes: JSON.parse(JSON.stringify(state.nodes)),
    edges: JSON.parse(JSON.stringify(state.edges)),
  });
  if (state.undoStack.length > MAX_UNDO) state.undoStack.shift();
  state.redoStack = [];
}

function undo() {
  if (state.undoStack.length === 0) return;

  state.redoStack.push({
    nodes: JSON.parse(JSON.stringify(state.nodes)),
    edges: JSON.parse(JSON.stringify(state.edges)),
  });

  const snap = state.undoStack.pop();
  state.nodes = snap.nodes;
  state.edges = snap.edges;
  state.selectedNodeId = null;
  state.selectedEdgeIdx = null;
  hideConfig();
  render();
}

function redo() {
  if (state.redoStack.length === 0) return;

  state.undoStack.push({
    nodes: JSON.parse(JSON.stringify(state.nodes)),
    edges: JSON.parse(JSON.stringify(state.edges)),
  });

  const snap = state.redoStack.pop();
  state.nodes = snap.nodes;
  state.edges = snap.edges;
  state.selectedNodeId = null;
  state.selectedEdgeIdx = null;
  hideConfig();
  render();
}

// =========================================================================
// CONTEXT MENU
// =========================================================================
function showContextMenu(x, y) {
  $contextMenu.style.left = x + 'px';
  $contextMenu.style.top = y + 'px';
  $contextMenu.classList.add('visible');
}

function hideContextMenu() {
  $contextMenu.classList.remove('visible');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#context-menu')) hideContextMenu();
});

// =========================================================================
// KEYBOARD SHORTCUTS
// =========================================================================
document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

  if (e.key === 'Escape') {
    deselectAll();
    hideContextMenu();
    return;
  }

  if (isInput) return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteSelected();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    savePipeline();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    redo();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
    e.preventDefault();
    duplicateNode();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
    e.preventDefault();
    // Select all — just highlight all nodes visually
    $canvas.querySelectorAll('.node').forEach(el => el.classList.add('selected'));
  }
});

// =========================================================================
// BIND EVENTS (called once)
// =========================================================================
function bindEvents() {
  updateTransform();

  // Prevent default context menu on canvas
  $container.addEventListener('contextmenu', (e) => {
    if (!e.target.closest('.node')) e.preventDefault();
  });
}

// =========================================================================
// PIPELINE OPERATIONS
// =========================================================================
function newPipeline() {
  if (state.dirty && !confirm('Discard unsaved changes?')) return;
  state.nodes = [];
  state.edges = [];
  state.selectedNodeId = null;
  state.selectedEdgeIdx = null;
  state.undoStack = [];
  state.redoStack = [];
  $('#pipeline-name').value = 'untitled';
  $('#pipeline-version').value = 1;
  markClean();
  hideConfig();
  render();
  toast('New pipeline created', 'info');
}

async function loadDefault() {
  try {
    const res = await fetch('/api/pipeline/default');
    if (!res.ok) throw new Error('Failed to load default');
    const data = await res.json();
    loadPipelineData(data);
    markClean();
    toast('Default pipeline loaded', 'success');
  } catch (e) {
    console.error('Load default failed:', e);
    toast('Failed to load default: ' + e.message, 'error');
  }
}

function loadPipelineData(data) {
  state.nodes = data.nodes || [];
  state.edges = data.edges || [];
  $('#pipeline-name').value = data.pipeline || 'untitled';
  $('#pipeline-version').value = data.version || 1;
  state.selectedNodeId = null;
  state.selectedEdgeIdx = null;
  state.undoStack = [];
  state.redoStack = [];
  hideConfig();
  render();

  // Auto-fit after load
  if (state.nodes.length > 0) {
    setTimeout(zoomFit, 50);
  }
}

async function savePipeline() {
  const name = $('#pipeline-name').value.trim() || 'untitled';
  const version = parseInt($('#pipeline-version').value) || 1;

  const body = {
    pipeline: name,
    version,
    nodes: state.nodes,
    edges: state.edges,
    metadata: {},
  };

  const btn = $('#btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch('/api/pipeline/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || (err.errors ? err.errors.join(', ') : 'Save failed'));
    }
    const data = await res.json();
    markClean();
    toast('Pipeline saved (hash: ' + data.content_hash + ')', 'success');
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>Save</span>';
  }
}

async function showLoadModal() {
  try {
    const res = await fetch('/api/pipeline/list');
    if (!res.ok) throw new Error('Failed to list');
    const data = await res.json();
    const pipelines = data.pipelines || [];

    if (pipelines.length === 0) {
      toast('No saved pipelines found', 'info');
      return;
    }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';

    let listHtml = '';
    for (const p of pipelines) {
      const date = p.updated_at ? new Date(p.updated_at * 1000).toLocaleDateString() : '';
      listHtml += `<li data-id="${p.id}">
        <span class="name">${escHtml(p.name)} v${p.version}</span>
        <span class="meta">${date}</span>
      </li>`;
    }

    overlay.innerHTML = `<div class="modal">
      <div class="modal-header">Load Pipeline</div>
      <div class="modal-body">
        <ul class="modal-list">${listHtml}</ul>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      </div>
    </div>`;

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });

    overlay.querySelectorAll('.modal-list li').forEach(li => {
      li.addEventListener('click', async () => {
        const id = li.dataset.id;
        try {
          const res = await fetch('/api/pipeline/get/' + id);
          if (!res.ok) throw new Error('Not found');
          const data = await res.json();
          loadPipelineData(data);
          markClean();
          overlay.remove();
          toast('Pipeline loaded', 'success');
        } catch (e) {
          toast('Failed to load: ' + e.message, 'error');
        }
      });
    });

    document.body.appendChild(overlay);
  } catch (e) {
    toast('Failed to list pipelines: ' + e.message, 'error');
  }
}

async function validatePipeline() {
  const name = $('#pipeline-name').value.trim() || 'untitled';
  const version = parseInt($('#pipeline-version').value) || 1;

  try {
    const res = await fetch('/api/pipeline/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        pipeline: name,
        version,
        nodes: state.nodes,
        edges: state.edges,
      }),
    });
    const data = await res.json();
    if (data.valid) {
      toast('Pipeline is valid!', 'success');
    } else {
      const errors = data.errors || [];
      toast('Validation errors: ' + errors.join('; '), 'error', 6000);
    }
  } catch (e) {
    toast('Validation failed: ' + e.message, 'error');
  }
}

async function runPipeline() {
  const name = $('#pipeline-name').value.trim() || 'untitled';

  // Show prompt modal
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header">Run Pipeline</div>
    <div class="modal-body">
      <div class="modal-field">
        <label class="modal-label">Task ID</label>
        <input class="modal-input" id="run-task-id" type="text" placeholder="e.g. SYASYAH-003" autofocus />
      </div>
      <div class="modal-field">
        <label class="modal-label">Task Data (JSON, optional)</label>
        <textarea class="modal-input" id="run-task-data" style="min-height:60px;font-family:var(--mono);font-size:12px" placeholder='{"project":"my-project"}'></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="run-cancel">Cancel</button>
      <button class="btn primary" id="run-execute">▶ Execute</button>
    </div>
  </div>`;

  document.body.appendChild(overlay);

  overlay.querySelector('#run-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const taskIdInput = overlay.querySelector('#run-task-id');
  taskIdInput.focus();

  const execute = async () => {
    const taskId = taskIdInput.value.trim();
    if (!taskId) {
      toast('Task ID is required', 'error');
      return;
    }

    overlay.remove();

    let taskData = {};
    const dataStr = overlay.querySelector('#run-task-data').value.trim();
    if (dataStr) {
      try { taskData = JSON.parse(dataStr); } catch (e) {
        toast('Invalid task data JSON', 'error');
        return;
      }
    }

    // Save first if dirty
    if (state.dirty) await savePipeline();

    // Find pipeline ID
    let pipelineId = null;
    try {
      const res = await fetch('/api/pipeline/list');
      if (res.ok) {
        const d = await res.json();
        const match = (d.pipelines || []).find(p => p.name === name);
        if (match) pipelineId = match.id;
      }
    } catch (e) { /* ignore */ }

    setExecStatus('running', 'Executing...');
    updateNodeStatuses('pending');

    try {
      const body = { task_id: taskId, task_data: taskData };
      if (pipelineId) body.pipeline_id = pipelineId;

      const res = await fetch('/api/pipeline/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Execution failed');
      }

      const exec = await res.json();
      state.executionId = exec.id;
      showExecutionResults(exec);
    } catch (e) {
      setExecStatus('failed', 'Failed: ' + e.message);
      toast('Execution failed: ' + e.message, 'error');
    }
  };

  overlay.querySelector('#run-execute').addEventListener('click', execute);
  taskIdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') execute();
  });
}

function setExecStatus(status, text) {
  state.executionStatus = status;
  $execStatus.textContent = text || status;
  $execStatus.style.color = status === 'running' ? 'var(--blue)' :
    status === 'completed' ? 'var(--green)' :
    status === 'failed' ? 'var(--red)' : 'var(--text)';
}

function updateNodeStatuses(defaultStatus) {
  state.nodes.forEach(n => {
    const el = document.getElementById('status-' + n.id);
    if (el) el.className = 'node-status ' + defaultStatus;

    const nodeEl = document.getElementById('node-' + n.id);
    if (nodeEl) {
      nodeEl.classList.remove('running', 'completed', 'failed');
    }
  });
}

function showExecutionResults(exec) {
  const panel = $('#exec-panel');
  const body = $('#exec-panel-body');

  const statusText = exec.status || 'unknown';
  setExecStatus(statusText, `Execution ${exec.id ? '#' + exec.id : ''}: ${statusText}`);

  let html = '';

  const nodeResults = exec.node_results || exec.results || {};
  const entries = Object.entries(nodeResults);

  if (entries.length === 0 && exec.output) {
    html += `<div style="padding:8px 0;color:var(--text2)">${escHtml(typeof exec.output === 'string' ? exec.output : JSON.stringify(exec.output))}</div>`;
  }

  for (const [nodeId, result] of entries) {
    const status = result.status || 'completed';
    const output = result.output ? (typeof result.output === 'string' ? result.output : JSON.stringify(result.output)) : '';
    html += `<div class="exec-result">
      <span class="node-name">#${escHtml(nodeId)}</span>
      <span class="status-badge status-${status}">${status}</span>
      <span class="output-text">${escHtml(truncate(output, 100))}</span>
    </div>`;

    // Animate node status
    const statusEl = document.getElementById('status-' + nodeId);
    if (statusEl) statusEl.className = 'node-status ' + status;

    const nodeEl = document.getElementById('node-' + nodeId);
    if (nodeEl) {
      nodeEl.classList.remove('running', 'completed', 'failed');
      nodeEl.classList.add(status);
    }
  }

  if (exec.error) {
    html += `<div style="color:var(--red);margin-top:10px;padding:8px;background:var(--red-bg);border-radius:4px">Error: ${escHtml(exec.error)}</div>`;
  }

  if (exec.duration_ms) {
    html += `<div style="color:var(--text3);margin-top:6px;font-size:11px">Duration: ${exec.duration_ms}ms</div>`;
  }

  body.innerHTML = html;
  panel.classList.add('visible');
}

function hideExecPanel() {
  $('#exec-panel').classList.remove('visible');
}

function truncate(str, len) {
  if (!str) return '';
  return str.length > len ? str.slice(0, len) + '…' : str;
}

// =========================================================================
// CONNECTION STATUS CHECK
// =========================================================================
async function checkConnection() {
  try {
    const res = await fetch('/api/pipeline/categories', { method: 'HEAD', signal: AbortSignal.timeout(3000) });
    $connDot.classList.remove('disconnected');
    $connText.textContent = 'Connected';
  } catch {
    $connDot.classList.add('disconnected');
    $connText.textContent = 'Disconnected';
  }
}

setInterval(checkConnection, 15000);
checkConnection();

// =========================================================================
// BOOT
// =========================================================================
init();
</script>
</body>
